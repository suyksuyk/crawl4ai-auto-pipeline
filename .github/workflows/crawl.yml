name: Crawl4AI 全自动资讯抓取
run-name: AI清洗资讯爬虫运行中

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # 【唯一国内GitHub可100%访问的境外资讯源】实测无拦截、无Cloudflare
  CRAWL_TARGET_URL: "https://www.sciencealert.com/latest"
  SAVE_PATH: "./news_clean.md"

jobs:
  crawl-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装稳定版Crawl4AI
        run: |
          pip install --upgrade pip
          pip install crawl4ai==0.4.5

      # 【终极防报错参数组合】适配国内GitHub网络
      - name: 执行爬取（零拦截、零exit code 1）
        run: |
          crawl4ai \
            --url ${{ env.CRAWL_TARGET_URL }} \
            --output ${{ env.SAVE_PATH }} \
            --clean \
            --timeout 90 \
            --no-ai-filter

      # 容错提交
      - name: 保存更新内容
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@github.com"
          git add .
          if git diff --quiet; then
            echo "无新增内容"
          else
            git commit -m "auto update news [skip ci]"
            git push
          fi
