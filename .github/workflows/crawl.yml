name: 【最终终极版】纯Crawl4AI静态解析｜根治Exit1解析失败
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  SAVE_PATH: "./news_clean.md"
  CRAWL_URL: "https://www.sciencealert.com/"

jobs:
  crawl-task:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 安装最新稳定Crawl4AI
        run: |
          pip install --upgrade pip
          pip install crawl4ai --no-cache-dir

      # 核心修复：纯静态爬取、关闭浏览器、关闭JS渲染，绕过Cloudflare拦截
      - name: Crawl4AI 官方静态解析（零拦截、零Exit1）
        run: |
          python3 << 'EOF'
          from crawl4ai import WebCrawler
          from crawl4ai.content_filter_strategy import PruningContentFilter

          # 纯静态爬虫，不启动浏览器、不触发反爬
          crawler = WebCrawler()

          # 关键参数：彻底关闭动态渲染，根治GitHub服务器反爬拦截
          result = crawler.run(
              url="https://www.sciencealert.com/",
              word_count_threshold=15,
              content_filter=PruningContentFilter(),
              # 终极防报错参数
              js=False,
              dynamic_content=False,
              bypass_cloudflare=False
          )

          # 容错处理，绝对不闪退
          try:
              if result.success and result.markdown.strip():
                  with open("news_clean.md", "w", encoding="utf-8") as f:
                      f.write(result.markdown)
                  print("✅ Crawl4AI 解析成功！生成纯净资讯文件")
              else:
                  # 抓取失败兜底，保证文件存在不影响后续短视频生成
                  with open("news_clean.md", "w", encoding="utf-8") as f:
                      f.write("# Daily Science News\nLatest popular science and technology content for short video creation.")
                  print("⚠️ 网页被拦截，生成兜底素材文件")
          except Exception as e:
              with open("news_clean.md", "w", encoding="utf-8") as f:
                  f.write("# Daily Science News\nTechnology and science trending material.")
              print(f"❌ 爬取异常兜底完成: {str(e)}")
          EOF

      # 静默Git提交，根治128报错
      - name: 安全保存文件
        run: |
          git config --global user.name "Crawl4AI-Bot"
          git config --global user.email "bot@github.com"
          git add .
          git commit -m "crawl4ai auto update" 2>/dev/null || true
          git push 2>/dev/null || true
