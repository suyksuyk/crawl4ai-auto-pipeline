name: Crawl4AI 全自动资讯抓取
run-name: AI清洗资讯爬虫运行中

# 定时：每天北京时间21点自动爬取 + 支持手动一键运行
on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  # 【终极稳定源】无Cloudflare反爬、Action可100%抓取
  CRAWL_TARGET_URL: "https://time.com/tech/"
  SAVE_PATH: "./news_clean.md"

jobs:
  crawl-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4

      - name: 配置Python环境（彻底关闭缓存报错）
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 纯手动安装依赖，完全规避缓存文件检测警告
      - name: 安装Crawl4AI及依赖
        run: |
          pip install --upgrade pip
          pip install crawl4ai==0.4.5

      # 终极稳定爬取参数：跳过AI解析、规避反爬、加长超时
      - name: 执行稳定资讯爬取
        run: |
          crawl4ai \
            --url ${{ env.CRAWL_TARGET_URL }} \
            --output ${{ env.SAVE_PATH }} \
            --clean \
            --timeout 60 \
            --no-ai-filter \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"

      # 容错提交，空内容不报错
      - name: 保存更新内容
        run: |
          git config --global user.name "AutoBot"
          git config --global user.email "bot@github.com"
          git add .
          if git diff --quiet; then
            echo "无新增内容，无需提交"
          else
            git commit -m "auto update news [skip ci]"
            git push
          fi
